<style>
:root{
  color-scheme:light;
  --bg:#EAF1FF; --surface:#FFFFFF; --surface2:#F4F7FF; --ink:#1F2A4D; --muted:#5E6890; --line:#D9E1F4;
  --sun:#FFC93C; --sunSoft:#FFF1C4; --sunInk:#4A3500; --coral:#F25F5C; --coralSoft:#FFE3E2;
  --mint:#21B486; --mintSoft:#D7F5EA; --lilac:#7C6CF0; --lilacSoft:#E9E5FF;
  --tileL:92%; --tileS:85%; --accL:52%; --accS:68%;
  --shadow:0 8px 20px -14px rgba(31,42,77,.45);
  --display:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131A2E; --surface:#1D2541; --surface2:#242E4F; --ink:#EEF1FF; --muted:#A5AFD3; --line:#33405F;
    --sunSoft:#3D3313; --coralSoft:#4A2427; --mintSoft:#173D33; --lilacSoft:#2D2856;
    --tileL:24%; --tileS:38%; --accL:66%; --accS:70%;
    --shadow:0 8px 20px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131A2E; --surface:#1D2541; --surface2:#242E4F; --ink:#EEF1FF; --muted:#A5AFD3; --line:#33405F;
  --sunSoft:#3D3313; --coralSoft:#4A2427; --mintSoft:#173D33; --lilacSoft:#2D2856;
  --tileL:24%; --tileS:38%; --accL:66%; --accS:70%;
  --shadow:0 8px 20px -14px rgba(0,0,0,.7);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px;border-radius:10px}
#app{max-width:640px;margin:0 auto;padding:18px 16px 110px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;font-weight:600}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.section{margin-top:24px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card{background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:999px;padding:10px 16px;background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;min-height:44px}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.sun{background:var(--sun);color:var(--sunInk)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line)}
.btn.danger{background:var(--coralSoft);color:var(--coral);box-shadow:none}
.btn.block{width:100%;justify-content:center}
.icon-btn{border:0;background:var(--surface);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;box-shadow:var(--shadow);flex:none}
.chip{border:0;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.chip.on{background:var(--ink);color:var(--bg)}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--surface2);white-space:nowrap}
.tag.late{background:var(--coralSoft);color:var(--coral)}
.tag.new{background:var(--lilacSoft);color:var(--lilac)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--lilac)}
textarea{min-height:80px;resize:vertical}
label.field{display:block}
label.field>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 5px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Hoy */
.hello{font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted)}
.today-date{font-size:34px;font-family:var(--display);font-weight:700;line-height:1.05;margin-top:2px}
.today-date small{display:block;font-size:20px;font-weight:500;color:var(--muted)}
.meter{margin-top:18px;background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.meter-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big-min{font-family:var(--display);font-size:42px;font-weight:700;line-height:1}
.big-min span{font-size:18px;font-weight:600;color:var(--muted);margin-left:4px}
.bar{position:relative;height:26px;border-radius:13px;background:var(--surface2);margin:16px 0 8px;display:flex;overflow:hidden}
.seg{height:100%;background:hsl(var(--h) var(--accS) var(--accL));border-right:2px solid var(--surface);transition:width .35s ease}
.seg.done{background:var(--mint);opacity:.55}
.seg.over{background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.55) 0 5px,transparent 5px 10px)}
.limit{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--ink)}
.budget{display:flex;align-items:center;gap:8px}
.budget button{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface2);font-weight:800;font-size:18px}
.budget b{font-family:var(--display);font-size:20px;min-width:72px;text-align:center}
.verdict{font-weight:800;font-size:15px}
.verdict.ok{color:var(--mint)} .verdict.over{color:var(--coral)}

.alert{background:var(--sunSoft);border-radius:22px;padding:14px 16px;margin-top:16px}
.alert h3{display:flex;gap:8px;align-items:center}
.ev{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 18%,transparent)}
.ev:first-of-type{border-top:0}
.ev time{font-weight:800;min-width:48px}
.ev .ttl{flex:1;font-weight:700}
.ev.done .ttl{text-decoration:line-through;opacity:.55}

.room-head{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-family:var(--display);font-weight:600;font-size:17px}
.room-dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:hsl(var(--h) var(--tileS) var(--tileL));font-size:17px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border-radius:20px;padding:12px;box-shadow:var(--shadow);border-left:6px solid hsl(var(--h) var(--accS) var(--accL));margin-bottom:10px}
.check{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid hsl(var(--h) var(--accS) var(--accL));background:transparent;display:grid;place-items:center;color:#fff;transition:background .2s,transform .2s}
.check svg{width:22px;height:22px;opacity:0}
.task.is-done .check{background:var(--mint);border-color:var(--mint)}
.task.is-done .check svg{opacity:1}
.task.is-done .tname{text-decoration:line-through;opacity:.55}
.task.pop .check{transform:scale(1.18)}
.tbody{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.tname{font-weight:800;font-size:16px}
.tmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.prods{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.prod{border:1.5px dashed var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.prod::after{content:" +🛒";opacity:.75}
.more{flex:none;border:0;background:var(--surface2);width:36px;height:36px;border-radius:12px;font-weight:800;font-size:18px;line-height:1}
.menu-today{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.menu-today .pill{background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);flex:1;min-width:140px}
.pill small{display:block;font-size:12px;font-weight:800;color:var(--muted)}
.pill b{font-weight:800}

.empty{text-align:center;padding:30px 18px;background:var(--surface);border-radius:26px;box-shadow:var(--shadow)}
.empty .big{font-size:52px}
.empty p{color:var(--muted);margin:8px 0 16px}

/* Casa */
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{border:0;text-align:left;border-radius:24px;padding:16px;min-height:132px;background:hsl(var(--h) var(--tileS) var(--tileL));display:flex;flex-direction:column;justify-content:space-between;color:var(--ink)}
.tile .em{font-size:36px;line-height:1}
.tile b{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.15}
.tile small{display:block;font-size:13px;font-weight:700;color:var(--muted)}
.tile.add{background:transparent;border:2.5px dashed var(--line);align-items:center;justify-content:center;text-align:center;color:var(--muted);font-weight:800}
.list-item{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.back{border:0;background:none;font-weight:800;color:var(--muted);padding:6px 0;margin-bottom:6px;font-size:15px}
.room-banner{border-radius:26px;padding:18px;background:hsl(var(--h) var(--tileS) var(--tileL));display:flex;align-items:center;gap:14px}
.room-banner .em{font-size:46px}

/* Compra */
.add-row{display:flex;gap:8px}
.add-row input{flex:1}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.box{flex:none;width:30px;height:30px;border-radius:10px;border:2.5px solid var(--line);background:transparent;display:grid;place-items:center;color:#fff}
.box svg{width:18px;height:18px;opacity:0}
.shop-item.got .box{background:var(--mint);border-color:var(--mint)}
.shop-item.got .box svg{opacity:1}
.shop-item .nm{flex:1;font-weight:700;min-width:0;background:none;border:0;text-align:left;padding:0}
.shop-item.got .nm{text-decoration:line-through;color:var(--muted)}
.qty{font-size:13px;font-weight:800;color:var(--muted)}
.x{border:0;background:none;color:var(--muted);font-size:20px;width:34px;height:34px;border-radius:50%}

/* Agenda */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{text-align:center;font-size:12px;font-weight:800;color:var(--muted);padding-bottom:4px}
.day{border:0;background:var(--surface);border-radius:14px;aspect-ratio:1/1.12;padding:5px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:14px;min-width:0}
.day.out{opacity:.35}
.day.today{background:var(--sun);color:var(--sunInk)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--coral)}
.dot.r{background:var(--lilac)}
.load{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:auto}
.day.today .load{color:var(--sunInk)}
.day.heavy .load{color:var(--coral)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* Menú */
.menu-day{background:var(--surface);border-radius:20px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.menu-day.today{outline:3px solid var(--sun)}
.menu-day h3{font-size:16px;margin-bottom:6px}
.meal{display:flex;gap:10px;align-items:center;width:100%;border:0;background:var(--surface2);border-radius:14px;padding:9px 12px;margin-top:6px;text-align:left}
.meal small{width:74px;flex:none;font-size:12px;font-weight:800;color:var(--muted)}
.meal span{flex:1;font-weight:700}
.meal span.ph{color:var(--muted);font-weight:600}

/* Biblioteca y recetario */
.lib-row{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.lib-row .list-item{margin:0;flex:1}
.list-item:disabled{opacity:.5}
.hint{background:var(--lilacSoft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700}
.seg-tabs{display:inline-flex;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow);margin-top:12px}
.seg-tabs button{border:0;background:none;border-radius:999px;padding:8px 16px;font-weight:800;color:var(--muted);min-height:40px}
.seg-tabs button.on{background:var(--ink);color:var(--bg)}
.rec-card{display:flex;gap:12px;align-items:center;width:100%;border:0;text-align:left;background:var(--surface);border-radius:20px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.rec-card .em{width:46px;height:46px;border-radius:14px;background:var(--sunSoft);display:grid;place-items:center;font-size:24px;flex:none}
.ings{list-style:none;margin:0;padding:0}
.ings li{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.ings li:last-child{border-bottom:0}
.ings b{min-width:0;white-space:nowrap}
.steps{margin:0;padding-left:22px}
.steps li{margin-bottom:10px;padding-left:4px}
.steps li::marker{font-family:var(--display);font-weight:700;color:var(--lilac)}
.serv{display:flex;align-items:center;gap:10px;background:var(--sunSoft);border-radius:18px;padding:10px 14px}
.serv button{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);font-weight:800;font-size:20px;box-shadow:var(--shadow)}
.serv b{font-family:var(--display);font-size:22px;min-width:28px;text-align:center}
/* Personas */
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.av{border:3px solid transparent;background:var(--surface);border-radius:20px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;box-shadow:var(--shadow)}
.av span{font-size:38px;line-height:1.1}
.av.on{border-color:var(--lilac);background:var(--lilacSoft)}
.me-btn{font-size:24px;margin-right:8px}
.who{background:var(--lilacSoft);color:var(--ink);border-radius:999px;padding:1px 8px;font-weight:800;font-size:12px}
.byme{font-size:17px;flex:none}
.week-card{display:block;width:100%;border:0;text-align:left;margin-top:14px;color:var(--ink)}
.nm-btn{border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.icon-btn:disabled{opacity:.35}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
/* Login */
.login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow:auto}
.login[hidden]{display:none}
.login-card{width:100%;max-width:380px;text-align:center}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--muted);position:relative}
nav.tabs button .e{font-size:22px;line-height:1.1;filter:grayscale(.6);transition:transform .2s}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on .e{filter:none;transform:translateY(-2px) scale(1.12)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--coral);color:#fff;font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:16px;padding:13px 14px;margin-top:8px;font-weight:800;text-align:left;box-shadow:var(--shadow)}
.opt .e{font-size:20px;width:28px;text-align:center}
.opt small{display:block;font-weight:600;color:var(--muted);font-size:13px}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{border:2px solid transparent;background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:22px}
.emojis button.on{border-color:var(--lilac)}
.hues{display:flex;gap:8px;flex-wrap:wrap}
.hues button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;background:hsl(var(--h) 75% 70%)}
.hues button.on{border-color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:calc(100% - 24px);animation:up .2s}
.toast button{border:0;background:var(--sun);color:var(--sunInk);border-radius:999px;padding:6px 12px;font-weight:800}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){#app{padding-top:28px}.today-date{font-size:40px}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" aria-label="Secciones" id="tabs"></nav>
<input type="file" id="fileIn" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="jsonIn" accept=".json,application/json" hidden>

/* ---------- Agenda ---------- */
function vAgenda() {
  const [y, m] = UI.calMonth.split("-").map(Number);
  const first = `${y}-${pad(m)}-01`, start = mondayOf(first);
  const days = Array.from({ length: 42 }, (_, i) => addDays(start, i));
  const lastShown = days[days.some((d, i) => i >= 35 && d.slice(0, 7) === UI.calMonth) ? 41 : 34];
  const shown = days.filter(d => d <= lastShown);
  const load = loadMap(TODAY, lastShown);
  const cells = shown.map(d => {
    const evs = eventsOn(d), l = d >= TODAY ? (load[d] || 0) : 0, heavy = l > available(d);
    return `<button class="day ${d.slice(0, 7) !== UI.calMonth ? "out" : ""} ${d === TODAY ? "today" : ""} ${heavy ? "heavy" : ""}" data-act="day" data-d="${d}" aria-label="${fmtLong(d)}${evs.length ? ", " + evs.length + " avisos" : ""}">
      ${parse(d).getDate()}<span class="dots">${evs.slice(0, 4).map(e => `<i class="dot ${e.type === "r" ? "r" : ""}"></i>`).join("")}</span>${l ? `<span class="load">${l}′</span>` : ""}</button>`;
  }).join("");
  const upcoming = [];
  for (let i = 0; i < 30; i++) { const d = addDays(TODAY, i); eventsOn(d).forEach(e => upcoming.push([d, e])); }
  return `<div class="row between"><h1>Agenda</h1><button class="btn primary" data-act="newevent" data-d="${TODAY}">＋ Nuevo</button></div>
    <div class="card section"><div class="cal-head"><button class="icon-btn" data-act="month" data-d="-1" aria-label="Mes anterior">‹</button><h2>${MES[m - 1][0].toUpperCase() + MES[m - 1].slice(1)} ${y}</h2><button class="icon-btn" data-act="month" data-d="1" aria-label="Mes siguiente">›</button></div>
      <div class="cal">${DOWS.map(d => `<div class="dow">${d}</div>`).join("")}${cells}</div>
      <div class="legend"><span><i style="background:var(--coral)"></i>Cita</span><span><i style="background:var(--lilac)"></i>Recordatorio</span><span>45′ = minutos de tareas ese día</span></div></div>
    <div class="section"><h2 style="margin-bottom:10px">Próximos 30 días</h2>
      ${upcoming.length ? `<div class="card">${upcoming.map(([d, e]) => `<div class="ev"><time style="min-width:84px">${d === TODAY ? "Hoy" : d === addDays(TODAY, 1) ? "Mañana" : fmtShort(d)}</time><span class="ttl">${e.time ? `<span class="muted">${esc(e.time)}</span> ` : ""}${esc(e.title)}</span><span class="tag" style="background:${e.type === "r" ? "var(--lilacSoft)" : "var(--coralSoft)"}">${e.type === "r" ? "recordatorio" : "cita"}</span><button class="more" data-act="evedit" data-id="${e.id}" aria-label="Editar">✎</button></div>`).join("")}</div>` : `<p class="muted">Nada apuntado. Toca un día del calendario para añadir una cita o un recordatorio.</p>`}</div>`;
}
function dayMenu(d) {

      if (s === "import") { closeSheet(); $("#fileIn").click(); }
      if (s === "export") exportExcel();
      if (s === "example") { closeSheet(); loadExample(); }
      if (s === "wipe") openSheet(`<h2>¿Borrar todo?</h2><p class="muted">Se borran habitaciones, tareas, compra, agenda, menú, recetas e historial. Las personas de casa se mantienen. Si quieres guardar una copia, exporta antes a Excel.</p>
        <button class="btn danger block" id="w_yes">Sí, borrar todo</button><button class="btn ghost block" style="margin-top:8px" data-close>Cancelar</button>`, s2 => {
        s2.querySelector("#w_yes").onclick = () => { for (const k of ["home", "shop", "agenda", "menu", "recipes", "log"]) { D[k] = clone(DEFAULTS[k]); } D.home.libInit = true; D.recipes.migrated = true; D.menu.v2 = true; D.log.init = true; save("home", "shop", "agenda", "menu", "recipes", "log"); closeSheet(); UI.roomId = null; render(); toast("Todo borrado"); };
      });
    });
  });
}
function editMember(id) {
  const isNew = !id, ms = members();
  const m = isNew ? { name: "", emoji: MEMBER_EMOJIS.find(e => !ms.some(x => x.emoji === e)) || MEMBER_EMOJIS[0], kid: false } : member(id);
  let emoji = m.emoji;
  openSheet(`<h2>${isNew ? "Nueva persona" : "Editar persona"}</h2>
    <div class="stack" style="margin-top:14px">
      <label class="field"><span>Nombre</span><input type="text" id="mb_n" value="${esc(m.name)}" placeholder="Ej.: Sara"></label>
      <label class="field"><span>Correo con el que entra en la app (opcional)</span><input type="email" id="mb_mail" value="${esc(m.email || "")}" placeholder="Así entra directa con su perfil"></label>
      ${m.uid ? `<p class="small muted" style="margin:-4px 4px 0">✅ Ya ha entrado con su cuenta. <button class="chip" id="mb_unlink">Desvincular</button></p>` : ""}
      <div><span class="small muted"><b>Su símbolo</b></span><div class="emojis" style="margin-top:6px">${MEMBER_EMOJIS.map(e => { const used = ms.find(x => x.emoji === e && x.id !== id); return `<button data-e="${e}" class="${e === emoji ? "on" : ""}" ${used ? `disabled title="Lo usa ${esc(used.name)}" style="opacity:.3"` : ""}>${e}</button>`; }).join("")}</div></div>
      <label class="row" style="font-weight:700;align-items:flex-start"><input type="checkbox" id="mb_k" ${m.kid ? "checked" : ""} style="width:22px;height:22px;min-height:0;margin-top:2px;flex:none"><span>Vista sencilla<span class="small muted" style="display:block;font-weight:600">Para peques: ve solo sus tareas y puede marcarlas, apuntar en la compra y ver la agenda y el menú. No cambia la casa, el menú ni los ajustes.</span></span></label>
      <button class="btn primary block" id="mb_save">Guardar</button>
      ${isNew ? "" : `<button class="btn danger block" id="mb_del">Quitar a ${esc(m.name)}</button>`}
    </div>`, sh => {
    if (isNew) sh.querySelector("#mb_n").focus();
    sh.querySelectorAll("[data-e]").forEach(b => b.onclick = () => { emoji = b.dataset.e; sh.querySelectorAll("[data-e]").forEach(x => x.classList.toggle("on", x === b)); });
    sh.querySelector("#mb_save").onclick = () => {
      const name = sh.querySelector("#mb_n").value.trim(); if (!name) return sh.querySelector("#mb_n").focus();
      const other = memberByName(name); if (other && other.id !== id) return toast("Ya hay alguien con ese nombre");
      const kid = sh.querySelector("#mb_k").checked, email = sh.querySelector("#mb_mail").value.trim();
      if (email && members().some(x => x.id !== id && (x.email || "").toLowerCase() === email.toLowerCase())) return toast("Ese correo ya está en otra persona");
      if (isNew) { const nm = { id: uid(), name, emoji, kid, email }; D.prefs.members.push(nm); if (!UI.me) setMe(nm.id); }
      else { if ((m.email || "") !== email) delete m.uid; Object.assign(m, { name, emoji, kid, email }); }
      save("prefs"); render(); settings(); toast(isNew ? `${emoji} ${name} ya está en la lista de casa` : "Guardado");
    };
    const ul = sh.querySelector("#mb_unlink"); if (ul) ul.onclick = () => { delete m.uid; save("prefs"); render(); settings(); toast("Desvinculado. La próxima vez elegirá perfil al entrar"); };
    const del = sh.querySelector("#mb_del");
    if (del) del.onclick = () => {
      D.prefs.members = ms.filter(x => x.id !== id);
      D.home.tasks.forEach(t => { if (t.who === id) t.who = ""; });
      if (UI.me === id) setMe("");
      save("prefs", "home"); render(); settings(); toast(`${m.name} ya no está en la lista. Sus tareas quedan sin asignar`);
    };
  });
}
/* ---------- eventos ---------- */
function onAppClick(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case "tick": tick(id); break;
    case "taskmenu": taskMenu(id); break;
    case "prod": addShop(b.dataset.name, "", "Limpieza"); renderTabs(); break;
    case "person": UI.person = b.dataset.p; render(); break;
    case "toggleDone": UI.showDone = !UI.showDone; render(); break;
    case "budget": { const cur = available(); D.prefs.override = { date: TODAY, min: Math.max(0, cur + +b.dataset.d) }; save("prefs"); render(); break; }
    case "spread": spread(); break;
    case "settings": settings(); break;
    case "import": $("#fileIn").click(); break;
    case "export": exportExcel(); break;
    case "example": loadExample(); break;
    case "room": UI.roomId = id; render(); scrollTo(0, 0); break;
    case "home": UI.roomId = null; render(); break;
    case "newroom": editRoom(null); break;
    case "editroom": editRoom(id); break;
    case "newtask": editTask(null, id); break;
    case "picktask": pickTask(id); break;
    case "menutab": UI.menuTab = b.dataset.t; render(); break;
    case "recipe": showRecipe(id); break;
    case "newrecipe": editRecipe(null); break;
    case "edittask": editTask(id); break;
    case "shopadd": shopAddFromForm(); break;
    case "shoptick": { const i = D.shop.items.find(x => x.id === id); if (i) { i.gotOn = i.gotOn ? null : TODAY; save("shop"); render(); } break; }
    case "shopdel": { const idx = D.shop.items.findIndex(x => x.id === id); if (idx > -1) { const [it] = D.shop.items.splice(idx, 1); save("shop"); render(); toast(`«${it.name}» quitado`, () => { D.shop.items.splice(idx, 0, it); save("shop"); render(); }); } break; }
    case "shopclear": D.shop.items = D.shop.items.filter(i => !i.gotOn); save("shop"); render(); break;
    case "month": { const [y, m] = UI.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + +b.dataset.d, 1); UI.calMonth = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; render(); break; }
    case "day": dayMenu(b.dataset.d); break;
    case "newevent": editEvent(null, b.dataset.d); break;
    case "evedit": editEvent(id); break;
    case "evdone": { const ev = D.agenda.events.find(x => x.id === id), d = b.dataset.d; if (ev) { ev.done = ev.done || []; ev.done = ev.done.includes(d) ? ev.done.filter(x => x !== d) : [...ev.done, d]; save("agenda"); if (sheetEl) { closeSheet(); dayMenu(d); } render(); } break; }
    case "week": UI.week = +b.dataset.d === 0 ? mondayOf(TODAY) : addDays(UI.week, +b.dataset.d); render(); break;
    case "meal": isKid() ? kidMeal(b.dataset.d, b.dataset.m) : editMeal(b.dataset.d, b.dataset.m); break;
    case "whoami": whoami(); break;
    case "summary": summary(); break;
    case "copyweek": {
      const prev = addDays(UI.week, -7); let n = 0;
      for (let i = 0; i < 7; i++) { const sd = addDays(prev, i), dd = addDays(UI.week, i); for (const meal of Object.keys(D.menu.days[sd] || {})) { const src = dishes(sd, meal); if (!src.length || dishes(dd, meal).length) continue; setDishes(dd, meal, src.map(e => { const c = clone(e); delete c.sh; c.id = uid(); return c; })); n++; } }
      if (n) { save("menu"); render(); toast(`${n} comidas copiadas`); } else toast("La semana anterior está vacía o esta ya está completa"); break;
    }
    case "weekshop": {
      const all = [];
      for (let i = 0; i < 7; i++) for (const arr of Object.values(D.menu.days[addDays(UI.week, i)] || {})) if (Array.isArray(arr)) all.push(...arr);
      const res = sendEntries(all); render(); toast(sentMsg(res)); break;
    }
  }
}
$("#app").addEventListener("click", onAppClick);
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (!b) return; UI.view = b.dataset.tab; if (UI.view !== "casa") UI.roomId = null; render(); scrollTo(0, 0); });
$("#app").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "s_name") shopAddFromForm(); });
$("#jsonIn").addEventListener("change", e => { const f = e.target.files[0]; if (f) importJSON(f); e.target.value = ""; });
$("#fileIn").addEventListener("change", e => { const f = e.target.files[0]; if (f) readExcel(f); e.target.value = ""; });

function morningAlert() {
  const evs = eventsOn(TODAY).filter(e => !evDone(e, TODAY));
  if (!evs.length || D.prefs.alertSeen === TODAY) return;
  D.prefs.alertSeen = TODAY; save("prefs");
  openSheet(`<div style="text-align:center"><div style="font-size:46px">🔔</div><h2>Hoy tienes ${evs.length === 1 ? "esto" : "estas cosas"}</h2></div>
    <div class="card section" style="margin-top:14px">${evs.map(e => `<div class="ev"><time>${e.time ? esc(e.time) : (e.type === "r" ? "📝" : "📍")}</time><span class="ttl">${esc(e.title)}</span></div>`).join("")}</div>
    <button class="btn sun block" style="margin-top:14px" data-close>Entendido</button>`);
}

loadLocal(); housekeeping(); render();
</script>
<div id="login" class="login" hidden>
  <div class="login-card">
    <div style="font-size:56px;line-height:1">🏡</div>
    <h1 style="margin-top:8px">Casa en orden</h1>
    <p class="muted" id="lg_msg">Entra con la cuenta que te han creado.</p>
    <div class="stack" style="margin-top:14px;text-align:left">
      <label class="field"><span>Correo</span><input type="email" id="lg_e" autocomplete="username" inputmode="email"></label>
      <label class="field"><span>Contraseña</span><input type="password" id="lg_p" autocomplete="current-password"></label>
      <button class="btn primary block" id="lg_go">Entrar</button>
      <button class="btn ghost block" id="lg_rs">He olvidado la contraseña</button>
    </div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const cfg = window.FIREBASE_CONFIG || {};
const L = document.getElementById("login"), msg = document.getElementById("lg_msg");
if (!cfg.apiKey || cfg.apiKey.startsWith("PEGA")) {
  L.hidden = false;
  msg.innerHTML = "Falta configurar Firebase: pega los datos de tu proyecto en <b>FIREBASE_CONFIG</b> al principio de index.html.";
  document.querySelectorAll("#login .stack").forEach(e => e.hidden = true);
} else {
  const app = initializeApp(cfg);
  const auth = getAuth(app), db = getDatabase(app);
  await setPersistence(auth, browserLocalPersistence).catch(() => {});
  let unsubs = [];
  const ERR = { "auth/invalid-credential": "Correo o contraseña incorrectos.", "auth/invalid-email": "Ese correo no es válido.", "auth/too-many-requests": "Demasiados intentos. Espera un rato.", "auth/network-request-failed": "Sin conexión. Inténtalo de nuevo." };
  const go = async () => {
    const e = document.getElementById("lg_e").value.trim(), p = document.getElementById("lg_p").value;
    if (!e || !p) return;
    msg.textContent = "Entrando…";
    try { await signInWithEmailAndPassword(auth, e, p); } catch (err) { msg.textContent = ERR[err.code] || "No se pudo entrar (" + err.code + ")."; }
  };
  document.getElementById("lg_go").onclick = go;
  document.getElementById("lg_p").onkeydown = ev => { if (ev.key === "Enter") go(); };
  document.getElementById("lg_rs").onclick = async () => {
    const e = document.getElementById("lg_e").value.trim();
    if (!e) { msg.textContent = "Escribe tu correo y vuelve a pulsar."; return; }
    try { await sendPasswordResetEmail(auth, e); msg.textContent = "Si el correo existe, te hemos enviado un enlace para cambiar la contraseña."; }
    catch (err) { msg.textContent = ERR[err.code] || "No se pudo enviar (" + err.code + ")."; }
  };
  window.appSignOut = () => signOut(auth).then(() => location.reload());
  onAuthStateChanged(auth, user => {
    unsubs.forEach(u => u()); unsubs = [];
    if (!user) { window.AUTH = null; L.hidden = false; msg.textContent = "Entra con la cuenta que te han creado."; return; }
    L.hidden = true;
    window.AUTH = { uid: user.uid, email: user.email || "" };
    window.FBX = { update: up => update(ref(db), up) };
    for (const k of KEYS) unsubs.push(onValue(ref(db, "casa/" + k), s => applyRemote(k, s.val()), err => {
      console.warn(err);
      if (err && /permission/i.test(err.message || err.code || "")) {
        L.hidden = false; document.querySelectorAll("#login .stack").forEach(e => e.hidden = true);
        msg.innerHTML = `Tu cuenta (<b>${esc(user.email || "")}</b>) aún no tiene permiso.<br>Pide que añadan este código en Firebase → Realtime Database → <b>permitidos</b>:<br><code style="user-select:all;word-break:break-all">${user.uid}</code><br><br><button class="btn" onclick="appSignOut()">Salir</button>`;
      }
    }));
  });
}
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
